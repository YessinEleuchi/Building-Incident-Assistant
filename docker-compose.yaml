services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow_local_password
      POSTGRES_DB: agentflow

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentflow -d agentflow",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      TZ: Africa/Tunis
      GENERIC_TIMEZONE: Africa/Tunis

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      WEBHOOK_URL: http://localhost:5678/

    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: